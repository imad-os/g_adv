<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echoes of Ardalia</title>
<link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>
<canvas id="gl"></canvas>
<div id="stage">
  <div id="hud" style="display:none">
    <div id="hearts"></div>
    <div id="hunger"><i id="hungerfill"></i></div>
    <div id="clock"></div>
    <div id="compass"><div id="compassStrip"></div><span id="qmark">★</span></div>
    <div id="stwheel"></div>
    <div id="weapon"></div>
    <div id="spurs"></div>
    <div id="prompt" style="display:none"></div>
    <div id="toasts"></div>
    <div id="trial" style="display:none"></div>
    <div id="level"></div>
    <div id="partner" style="display:none"></div>
  </div>
  <div id="fps" style="display:none"></div>
  <div id="banner"><b id="bannerTitle"></b><span id="bannerSub"></span></div>
  <div id="flash"></div>
  <div id="dialog" style="display:none"><b id="dlgName"></b><p id="dlgText"></p><ul id="dlgChoices"></ul></div>
  <div id="screen" style="display:none"><div id="tabs"></div><div id="status"></div><div id="panel"></div><div id="hint"></div></div>
</div>
<script src="https://imad-os.github.io/g/sdk/mypc-sdk.js"></script>
<script src="lib/three.min.js?v=1.3.0"></script>
<script src="i18n.js?v=1.3.0"></script>
<script src="js/noise.js?v=1.3.0"></script>
<script src="js/config.js?v=1.3.0"></script>
<script src="js/data.js?v=1.3.0"></script>
<script src="js/pad.js?v=1.3.0"></script>
<script src="js/state.js?v=1.3.0"></script>
<script src="js/world.js?v=1.3.0"></script>
<script src="js/chars.js?v=1.3.0"></script>
<script src="js/audio.js?v=1.3.0"></script>
<script src="js/voice.js?v=1.3.0"></script>
<script src="js/player.js?v=1.3.0"></script>
<script src="js/agents.js?v=1.3.0"></script>
<script src="js/quests.js?v=1.3.0"></script>
<script src="js/coop.js?v=1.3.0"></script>
<script src="js/ui.js?v=1.3.0"></script>
<script src="js/main.js?v=1.3.0"></script>
</body>
</html>
